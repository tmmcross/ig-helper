name: Feature Branch Test Build

on:
  push:
    branches:
      - feature/ig-helper-plus-foundation
    paths-ignore:
      - main.js
  workflow_dispatch:

permissions:
  contents: write

# Serialize builds that commit the generated main.js back to this branch.
# Keep the active run; newer pending runs replace older pending runs.
concurrency:
  group: feature-branch-test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ig-helper-plus-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build userscript
        run: npm run build

      - name: Run ESLint
        run: npx eslint main.js --quiet

      - name: Commit generated main.js to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          if ! git diff --cached --quiet; then
            git commit -m "Build userscript for feature branch testing"
            git push origin HEAD:feature/ig-helper-plus-foundation
          fi

      - name: Upload testable userscript
        uses: actions/upload-artifact@v4
        with:
          name: ig-helper-plus-test-build
          path: main.js
          if-no-files-found: error
          retention-days: 14
